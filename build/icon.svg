<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Labelbench app icon: a yellow 3:2 label on a dark rounded square.
       The square follows the macOS icon grid (824 px with 100 px margins); render to build/icon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3330"/>
      <stop offset="1" stop-color="#171c1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="227" y="322" width="570" height="380" rx="44" fill="#F2C200"/>
  </g>
  <rect x="307" y="425" width="300" height="56" rx="10" fill="#1D2422"/>
  <rect x="307" y="525" width="190" height="46" rx="9" fill="#1D2422"/>
</svg>
