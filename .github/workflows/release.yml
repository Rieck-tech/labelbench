name: Release

# Push a tag like v0.2.0 to build the desktop app for Windows, macOS and Linux.
# The installers are attached to a draft release, to check and publish by hand. If the release
# already exists (made on GitHub's release page, which also creates the tag), they are added to it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Downloads Brady's SDK from npm. It is only ever part of the built app, never the repository.
      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # No code-signing certificates yet; build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: labelbench-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # If the release was already made on GitHub's release page (which also creates the tag),
      # attach the installers to it; otherwise create a draft release with them.
      - name: Attach installers to the release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "Labelbench $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
