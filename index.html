<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merkelapp</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='28' height='14' rx='2' fill='%23F2C200'/%3E%3Crect x='6' y='13' width='14' height='2.4' fill='%231D2422'/%3E%3Crect x='6' y='17' width='9' height='2' fill='%231D2422'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="src/styles.css">

    <!-- Everything is loaded from this computer, so the app works without internet. -->
    <script type="importmap">
        {
            "imports": {
                "brady-web-sdk": "./node_modules/@bradycorporation/brady-web-sdk/dist/bundle.js",
                "bwip-js": "./node_modules/bwip-js/dist/bwip-js.mjs"
            }
        }
    </script>
    <script src="node_modules/exceljs/dist/exceljs.min.js" defer></script>
    <script type="module" src="src/app.js"></script>
</head>
<body>
    <header class="topbar">
        <h1 class="brand">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="28" height="14" rx="2"/><rect class="ink" x="6" y="13" width="14" height="2.4"/><rect class="ink" x="6" y="17" width="9" height="2"/></svg>
            Merkelapp
        </h1>
        <div class="printer" id="printer" aria-live="polite"></div>
    </header>

    <main class="workspace">
        <section class="data panel" aria-labelledby="data-heading">
            <div class="panel-head">
                <h2 id="data-heading">Data</h2>
                <div id="file-info" class="file-info"></div>
            </div>
            <div id="data-body" class="data-body"></div>
            <input type="file" id="file-input" accept=".csv,.tsv,.txt,.xlsx" hidden>
        </section>

        <section class="label-side" aria-label="Label">
            <div class="preview panel" aria-labelledby="preview-heading">
                <div class="panel-head">
                    <h2 id="preview-heading">Preview</h2>
                    <div id="preview-nav" class="preview-nav"></div>
                </div>
                <div id="preview" class="tape-wrap"></div>
                <div id="preview-notes" class="preview-notes" aria-live="polite"></div>
            </div>

            <div class="design panel" aria-labelledby="design-heading">
                <div class="panel-head">
                    <h2 id="design-heading">Label design</h2>
                    <div class="head-actions">
                        <button type="button" class="quiet" data-action="export-template">Save design…</button>
                        <button type="button" class="quiet" data-action="import-template">Open design…</button>
                        <input type="file" id="template-input" accept=".json,application/json" hidden>
                    </div>
                </div>
                <div id="design"></div>
            </div>
        </section>
    </main>

    <footer class="printbar" id="printbar" aria-live="polite"></footer>

    <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
